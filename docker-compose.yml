# PostgreSQL for the `prod` Spring profile. Local use only: change the password for anything shared.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: userauth
      POSTGRES_USER: userauth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-userauth-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U userauth -d userauth"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
