spring:
  application:
    name: user-auth
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  # Behind a reverse proxy, set to "native" (and configure the proxy's IP as trusted) so the
  # rate limiter sees the real client IP. Never trust X-Forwarded-For from arbitrary clients.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    # Adds the request ID (set by RequestIdFilter) to every log line.
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    # Required outside dev: at least 32 random characters, e.g. `openssl rand -base64 48`.
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:30m}
    issuer: user-auth
  auth-cookie:
    name: access_token
    secure: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  dev-tools:
    enabled: false
  rate-limit:
    enabled: true
    # Login + register, per client IP. Strict: slows down password guessing and account spam.
    auth:
      capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
      period: 1m
    # Every other /api call, per client IP.
    api:
      capacity: ${RATE_LIMIT_API_CAPACITY:120}
      period: 1m
