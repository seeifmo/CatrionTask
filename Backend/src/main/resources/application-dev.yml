# Local development: in-memory H2, a seeded test user, H2 console and Swagger UI.
spring:
  datasource:
    url: jdbc:h2:mem:userauth;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  h2:
    console:
      enabled: true

logging:
  level:
    # Shows the AOP method-level logs (arguments, timings) locally.
    com.task.userauth: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  jwt:
    # Dev-only key. Never use it anywhere else.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  auth-cookie:
    # Plain http on localhost.
    secure: false
  dev-tools:
    enabled: true
  rate-limit:
    # Looser locally: the Angular dev proxy makes every browser tab look like the same IP (127.0.0.1).
    auth:
      capacity: ${RATE_LIMIT_AUTH_CAPACITY:30}
  # Test logins for local development (see README / REVIEWER_GUIDE).
  seed:
    users:
      - username: demo
        password: Demo12345
        email: demo@example.com
        full-name: Demo User
        role: USER
      - username: admin
        password: Admin12345
        email: admin@example.com
        full-name: Admin User
        role: ADMIN
